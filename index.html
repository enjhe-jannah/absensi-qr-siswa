<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Presensi Sholat XII MIA 2</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #eef4f1;

      color: #17352c;

    }


    .container {

      width: 100%;

      max-width: 620px;

      margin: auto;

      padding: 14px;

    }


    .card {

      background: white;

      border-radius: 26px;

      padding: 20px;

      box-shadow:
        0 8px 30px rgba(0,0,0,0.08);

    }


    h1 {

      margin: 0;

      font-size: 27px;

      font-weight: 800;

      color: #174c3a;

    }


    .subtitle {

      margin-top: 5px;

      color: #66746e;

      font-size: 15px;

    }


    /* =========================================
       PILIH SESI
       ========================================= */

    .session-title {

      margin-top: 20px;

      margin-bottom: 10px;

      font-size: 14px;

      font-weight: 700;

      color: #52635c;

    }


    .sessions {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;

    }


    .session-button {

      border: 2px solid #dce8e2;

      background: #f7faf8;

      color: #174c3a;

      border-radius: 18px;

      padding: 15px 8px;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

    }


    .session-button.active {

      background: #174c3a;

      color: white;

      border-color: #174c3a;

    }


    .session-icon {

      display: block;

      font-size: 25px;

      margin-bottom: 5px;

    }


    /* =========================================
       STATISTIK
       ========================================= */

    .stats {

      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 9px;

      margin: 17px 0;

    }


    .stat {

      background: #f2f7f4;

      border-radius: 17px;

      padding: 12px 4px;

      text-align: center;

    }


    .stat-number {

      display: block;

      font-size: 27px;

      font-weight: 800;

      color: #174c3a;

    }


    .stat-label {

      display: block;

      margin-top: 2px;

      font-size: 12px;

      color: #63716b;

    }


    /* =========================================
       CAMERA
       ========================================= */

    .camera-box {

      border-radius: 20px;

      overflow: hidden;

      background: #111;

      min-height: 280px;

    }


    #reader {

      width: 100%;

    }


    #reader video {

      width: 100% !important;

      height: auto !important;

      border-radius: 20px;

    }


    /* =========================================
       BUTTON
       ========================================= */

    .button {

      width: 100%;

      border: none;

      border-radius: 16px;

      padding: 15px;

      margin-top: 13px;

      background: #174c3a;

      color: white;

      font-size: 17px;

      font-weight: 700;

      cursor: pointer;

    }


    .button:active {

      transform: scale(.98);

    }


    .button.secondary {

      background: #e8efeb;

      color: #174c3a;

    }


    /* =========================================
       STATUS
       ========================================= */

    .status {

      margin-top: 14px;

      padding: 17px;

      border-radius: 18px;

      background: #edf4f0;

      color: #35534a;

      text-align: center;

      font-size: 15px;

      font-weight: 600;

      min-height: 58px;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .status.success {

      background: #dff5e9;

      color: #12633c;

    }


    .status.warning {

      background: #fff0d7;

      color: #8a5a00;

    }


    .status.error {

      background: #ffe2e2;

      color: #a31f1f;

    }


    /* =========================================
       SISWA
       ========================================= */

    .student {

      display: none;

      margin-top: 13px;

      padding: 18px;

      border-radius: 20px;

      background: #174c3a;

      color: white;

      text-align: center;

    }


    .student.show {

      display: block;

    }


    .student-label {

      font-size: 12px;

      opacity: .8;

    }


    .student-name {

      margin-top: 4px;

      font-size: 24px;

      font-weight: 800;

    }


    .student-class {

      margin-top: 3px;

      font-size: 14px;

      opacity: .9;

    }


    .student-session {

      margin-top: 8px;

      font-size: 13px;

      font-weight: 700;

      opacity: .9;

    }


    .info {

      margin-top: 16px;

      font-size: 12px;

      line-height: 1.5;

      color: #697771;

      text-align: center;

    }


    @media (max-width: 450px) {

      .container {

        padding: 10px;

      }

      .card {

        padding: 16px;

      }

      h1 {

        font-size: 24px;

      }

      .student-name {

        font-size: 21px;

      }

    }

  </style>

</head>


<body>


<div class="container">

  <div class="card">


    <!-- HEADER -->

    <h1>
      Presensi Sholat
    </h1>

    <div class="subtitle">
      Kelas XII MIA 2 • 31 Siswa
    </div>


    <!-- PILIH SESI -->

    <div class="session-title">
      PILIH SESI PRESENSI
    </div>


    <div class="sessions">


      <button
        id="dzuhurButton"
        class="session-button"
        onclick="selectSession('Sholat Dzuhur')"
      >

        <span class="session-icon">
          🕌
        </span>

        Sholat Dzuhur

      </button>


      <button
        id="asharButton"
        class="session-button"
        onclick="selectSession('Sholat Ashar')"
      >

        <span class="session-icon">
          🌇
        </span>

        Sholat Ashar

      </button>


    </div>


    <!-- STATISTIK -->

    <div class="stats">

      <div class="stat">

        <span
          id="hadir"
          class="stat-number"
        >
          -
        </span>

        <span class="stat-label">
          Hadir
        </span>

      </div>


      <div class="stat">

        <span
          id="belum"
          class="stat-number"
        >
          -
        </span>

        <span class="stat-label">
          Belum
        </span>

      </div>


      <div class="stat">

        <span
          id="total"
          class="stat-number"
        >
          31
        </span>

        <span class="stat-label">
          Total
        </span>

      </div>

    </div>


    <!-- CAMERA -->

    <div class="camera-box">

      <div id="reader"></div>

    </div>


    <!-- MULAI -->

    <button
      id="startButton"
      class="button"
      onclick="startCamera()"
    >

      📷 Mulai Kamera

    </button>


    <!-- STOP -->

    <button
      id="stopButton"
      class="button secondary"
      onclick="stopCamera()"
      style="display:none;"
    >

      ⏹️ Hentikan Kamera

    </button>


    <!-- STATUS -->

    <div
      id="status"
      class="status"
    >

      Pilih sesi terlebih dahulu.

    </div>


    <!-- SISWA -->

    <div
      id="student"
      class="student"
    >

      <div class="student-label">
        SISWA TERDETEKSI
      </div>


      <div
        id="studentName"
        class="student-name"
      >
        -
      </div>


      <div
        id="studentClass"
        class="student-class"
      >
        XII MIA 2
      </div>


      <div
        id="studentSession"
        class="student-session"
      >
        -
      </div>

    </div>


    <div class="info">

      Setiap siswa dapat presensi
      <b>1× Sholat Dzuhur</b> dan
      <b>1× Sholat Ashar</b>
      setiap hari.

      <br>

      Scan kedua pada sesi yang sama
      otomatis ditolak.

    </div>


  </div>

</div>


<script>


/**************************************************
 * KONFIGURASI
 **************************************************/

const API_URL =
  "https://script.google.com/macros/s/AKfycbytJl0gE1YIkkFfI8NUHsX_YhKyhiWlrfRUXCEMzhDqAMfYuQRldhOP6x9PrLc1sa86/exec";


/**************************************************
 * VARIABEL
 **************************************************/

let scanner = null;

let scannerRunning = false;

let processingScan = false;

let selectedSession = "";

let audioContext = null;


/**************************************************
 * PILIH SESI
 **************************************************/

function selectSession(session) {

  selectedSession = session;


  document
    .getElementById("dzuhurButton")
    .classList
    .remove("active");


  document
    .getElementById("asharButton")
    .classList
    .remove("active");


  if (
    session === "Sholat Dzuhur"
  ) {

    document
      .getElementById("dzuhurButton")
      .classList
      .add("active");

  }


  if (
    session === "Sholat Ashar"
  ) {

    document
      .getElementById("asharButton")
      .classList
      .add("active");

  }


  hideStudent();


  refreshSummary();


  if (scannerRunning) {

    setStatus(
      "✓ Sesi diganti menjadi " +
      session +
      ". Siap scan."
    );

  } else {

    setStatus(
      "Sesi " +
      session +
      " dipilih. Tekan Mulai Kamera."
    );

  }

}


/**************************************************
 * STATUS
 **************************************************/

function setStatus(
  message,
  type = ""
) {

  const element =
    document.getElementById(
      "status"
    );


  element.textContent =
    message;


  element.className =
    "status " +
    type;

}


/**************************************************
 * AUDIO BEEP
 **************************************************/

function beep(
  frequency = 1000,
  duration = 100
) {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.value =
      frequency;


    gain.gain.value =
      0.08;


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime +
      duration / 1000
    );

  } catch (error) {

    console.log(error);

  }

}


/**************************************************
 * TAMPILKAN SISWA
 **************************************************/

function showStudent(
  name,
  className,
  session
) {

  document
    .getElementById(
      "studentName"
    )
    .textContent =
    name;


  document
    .getElementById(
      "studentClass"
    )
    .textContent =
    className;


  document
    .getElementById(
      "studentSession"
    )
    .textContent =
    session;


  document
    .getElementById(
      "student"
    )
    .classList
    .add("show");

}


/**************************************************
 * SEMBUNYIKAN SISWA
 **************************************************/

function hideStudent() {

  document
    .getElementById(
      "student"
    )
    .classList
    .remove("show");

}


/**************************************************
 * JSONP
 **************************************************/

function callApi(
  params
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {


      const callbackName =
        "jsonp_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() *
          100000
        );


      const script =
        document.createElement(
          "script"
        );


      const timeout =
        setTimeout(
          () => {

            cleanup();

            reject(
              new Error(
                "Server tidak merespons."
              )
            );

          },
          15000
        );


      function cleanup() {

        clearTimeout(
          timeout
        );


        delete window[
          callbackName
        ];


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }


      window[
        callbackName
      ] =
      function(data) {

        cleanup();

        resolve(data);

      };


      const query =
        new URLSearchParams();


      Object.keys(params)
        .forEach(
          key => {

            query.append(
              key,
              params[key]
            );

          }
        );


      query.append(
        "callback",
        callbackName
      );


      script.src =
        API_URL +
        "?" +
        query.toString();


      script.onerror =
      function() {

        cleanup();

        reject(
          new Error(
            "Tidak dapat terhubung ke server."
          )
        );

      };


      document.body.appendChild(
        script
      );

    }
  );

}


/**************************************************
 * SCAN BERHASIL
 **************************************************/

function onScanSuccess(
  decodedText
) {

  if (
    processingScan
  ) {

    return;

  }


  if (
    !selectedSession
  ) {

    beep(
      300,
      200
    );


    setStatus(
      "⚠️ Pilih sesi Dzuhur atau Ashar terlebih dahulu.",
      "warning"
    );


    return;

  }


  processingScan =
    true;


  recordAttendance(
    decodedText.trim()
  );


  /*
   * Kunci sementara agar satu QR
   * tidak terbaca berkali-kali
   * oleh frame kamera.
   */

  setTimeout(
    () => {

      processingScan =
        false;

    },
    1800
  );

}


/**************************************************
 * CATAT PRESENSI
 **************************************************/

async function recordAttendance(
  code
) {

  try {

    setStatus(
      "Memeriksa " +
      code +
      "...",
      ""
    );


    const result =
      await callApi({

        api:
          "scan",

        code:
          code,

        session:
          selectedSession

      });


    /**********************************************
     * BERHASIL
     **********************************************/

    if (
      result.ok
    ) {

      beep(
        1500,
        140
      );


      showStudent(
        result.name,
        result.className,
        result.session
      );


      setStatus(
        "✓ " +
        result.name +
        " — HADIR " +
        result.session,
        "success"
      );


      refreshSummary();


      /*
       * Setelah 1,8 detik
       * siap menerima siswa berikutnya.
       */

      setTimeout(
        () => {

          if (
            scannerRunning
          ) {

            setStatus(
              "📷 Siap scan siswa berikutnya..."
            );

          }

        },
        1800
      );


      return;

    }


    /**********************************************
     * DUPLIKAT
     **********************************************/

    if (
      result.duplicate
    ) {

      beep(
        500,
        220
      );


      showStudent(
        result.name,
        result.className,
        result.session
      );


      setStatus(
        "⚠️ " +
        result.name +
        " sudah presensi " +
        result.session +
        " hari ini.",
        "warning"
      );


      return;

    }


    /**********************************************
     * QR TIDAK VALID
     **********************************************/

    beep(
      300,
      220
    );


    setStatus(
      "❌ " +
      result.message,
      "error"
    );


  } catch (error) {

    console.error(
      error
    );


    beep(
      250,
      250
    );


    setStatus(
      "❌ Tidak terhubung ke server.",
      "error"
    );

  }

}


/**************************************************
 * MULAI KAMERA
 **************************************************/

async function startCamera() {

  if (
    !selectedSession
  ) {

    setStatus(
      "⚠️ Pilih Sholat Dzuhur atau Sholat Ashar terlebih dahulu.",
      "warning"
    );


    return;

  }


  if (
    scannerRunning
  ) {

    return;

  }


  hideStudent();


  try {

    audioContext =
      audioContext ||
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    if (
      audioContext.state ===
      "suspended"
    ) {

      await audioContext.resume();

    }

  } catch (error) {}


  setStatus(
    "Meminta akses kamera..."
  );


  scanner =
    new Html5Qrcode(
      "reader"
    );


  try {

    await scanner.start(

      {
        facingMode:
          {
            exact:
              "environment"
          }
      },

      {

        fps: 12,

        qrbox:
          function(
            width,
            height
          ) {

            const size =
              Math.floor(
                Math.min(
                  width,
                  height
                ) *
                0.68
              );


            return {

              width:
                size,

              height:
                size

            };

          },

        aspectRatio:
          1.0,

        disableFlip:
          false

      },

      onScanSuccess,

      function() {}

    );


    scannerRunning =
      true;


    document
      .getElementById(
        "startButton"
      )
      .style
      .display =
      "none";


    document
      .getElementById(
        "stopButton"
      )
      .style
      .display =
      "block";


    setStatus(
      "📷 " +
      selectedSession +
      " aktif. Arahkan ke QR siswa."
    );


  } catch (error) {

    console.error(
      error
    );


    try {

      await scanner.stop();

    } catch (e) {}


    try {

      await scanner.clear();

    } catch (e) {}


    scanner =
      new Html5Qrcode(
        "reader"
      );


    try {

      await scanner.start(

        {
          facingMode:
            "environment"
        },

        {

          fps: 12,

          qrbox:
            {
              width: 250,
              height: 250
            },

          disableFlip:
            false

        },

        onScanSuccess,

        function() {}

      );


      scannerRunning =
        true;


      document
        .getElementById(
          "startButton"
        )
        .style
        .display =
        "none";


      document
        .getElementById(
          "stopButton"
        )
        .style
        .display =
        "block";


      setStatus(
        "📷 " +
        selectedSession +
        " aktif. Arahkan ke QR siswa."
      );


    } catch (fallbackError) {

      console.error(
        fallbackError
      );


      setStatus(
        "❌ Kamera tidak dapat digunakan. Pastikan izin kamera browser sudah diberikan.",
        "error"
      );

    }

  }

}


/**************************************************
 * STOP KAMERA
 **************************************************/

async function stopCamera() {

  if (!scanner) {

    return;

  }


  try {

    if (
      scannerRunning
    ) {

      await scanner.stop();

    }

  } catch (error) {}


  try {

    await scanner.clear();

  } catch (error) {}


  scannerRunning =
    false;


  document
    .getElementById(
      "startButton"
    )
    .style
    .display =
    "block";


  document
    .getElementById(
      "stopButton"
    )
    .style
    .display =
    "none";


  setStatus(
    "Kamera dihentikan."
  );

}


/**************************************************
 * UPDATE JUMLAH HADIR
 **************************************************/

async function refreshSummary() {

  if (
    !selectedSession
  ) {

    document
      .getElementById(
        "hadir"
      )
      .textContent =
      "-";


    document
      .getElementById(
        "belum"
      )
      .textContent =
      "-";


    return;

  }


  try {

    const result =
      await callApi({

        api:
          "summary",

        session:
          selectedSession

      });


    document
      .getElementById(
        "hadir"
      )
      .textContent =
      result.hadir;


    document
      .getElementById(
        "belum"
      )
      .textContent =
      result.belum;


    document
      .getElementById(
        "total"
      )
      .textContent =
      result.total;

  } catch (error) {

    console.log(
      "Summary:",
      error
    );

  }

}

</script>

</body>

</html>
