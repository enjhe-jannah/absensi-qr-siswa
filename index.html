<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <title>Presensi Sholat XII MIA 2</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background: #064e3b;
    }

    body {
      min-height: 100vh;
      color: white;
    }


    /* ================================
       CONTAINER
       ================================ */

    .container {

      width: 100%;
      max-width: 520px;

      margin: auto;

      padding:
        14px
        14px
        25px;

    }


    /* ================================
       HEADER
       ================================ */

    .header {

      text-align: center;

      margin-bottom: 12px;

    }

    .header-icon {

      font-size: 38px;

      line-height: 1;

      margin-bottom: 5px;

    }

    .header h1 {

      margin: 0;

      font-size: 23px;

      font-weight: 800;

      letter-spacing: .3px;

    }

    .header p {

      margin: 4px 0 0;

      font-size: 14px;

      opacity: .9;

    }


    /* ================================
       MAIN CARD
       ================================ */

    .card {

      background: #ffffff;

      color: #111827;

      border-radius: 22px;

      padding: 15px;

      box-shadow:
        0 12px 35px
        rgba(0,0,0,.28);

    }


    /* ================================
       SESSION
       ================================ */

    .session-label {

      text-align: center;

      font-size: 14px;

      font-weight: 700;

      margin-bottom: 9px;

      color: #374151;

    }

    .session-buttons {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 9px;

    }

    .session-button {

      border: 0;

      border-radius: 13px;

      padding: 13px 8px;

      font-size: 15px;

      font-weight: 800;

      background: #e5e7eb;

      color: #374151;

      cursor: pointer;

    }

    .session-button.active {

      background: #047857;

      color: white;

    }

    .session-button:disabled {

      opacity: .55;

    }


    /* ================================
       CAMERA BUTTON
       ================================ */

    .camera-button {

      width: 100%;

      margin-top: 10px;

      border: 0;

      border-radius: 13px;

      padding: 14px;

      background: #111827;

      color: white;

      font-size: 16px;

      font-weight: 800;

      cursor: pointer;

    }

    .camera-button.stop {

      background: #b91c1c;

    }


    /* ================================
       CAMERA
       ================================ */

    #reader {

      width: 100%;

      margin-top: 12px;

      border-radius: 16px;

      overflow: hidden;

      background: #000;

    }

    #reader video {

      width: 100% !important;

      height: auto !important;

      display: block;

      object-fit: cover;

    }

    #reader__scan_region {

      min-height: 260px;

    }

    #reader__dashboard {

      display: none !important;

    }


    /* ================================
       SCAN GUIDE
       ================================ */

    .scan-guide {

      text-align: center;

      font-size: 12px;

      color: #6b7280;

      margin-top: 7px;

    }


    /* ================================
       COUNTER
       ================================ */

    .counter-box {

      margin-top: 13px;

      padding: 12px;

      border-radius: 14px;

      background: #ecfdf5;

      text-align: center;

    }

    .counter-label {

      font-size: 12px;

      color: #047857;

      font-weight: 700;

    }

    .counter {

      margin-top: 1px;

      font-size: 27px;

      font-weight: 900;

      color: #047857;

    }


    /* ================================
       RESULT
       ================================ */

    .result {

      margin-top: 12px;

      padding: 15px;

      border-radius: 16px;

      text-align: center;

      background: #f3f4f6;

      min-height: 105px;

      display: flex;

      flex-direction: column;

      justify-content: center;

    }

    .result.success {

      background: #dcfce7;

      color: #166534;

    }

    .result.warning {

      background: #fef3c7;

      color: #92400e;

    }

    .result.error {

      background: #fee2e2;

      color: #991b1b;

    }

    .result-title {

      font-size: 14px;

      font-weight: 800;

    }

    .result-name {

      margin-top: 3px;

      font-size: 21px;

      line-height: 1.25;

      font-weight: 900;

    }

    .result-code {

      margin-top: 4px;

      font-size: 12px;

      opacity: .75;

    }

    .result-session {

      margin-top: 3px;

      font-size: 13px;

      font-weight: 700;

    }

    .result-time {

      margin-top: 2px;

      font-size: 12px;

      opacity: .75;

    }


    /* ================================
       INSTRUCTION
       ================================ */

    .instruction {

      text-align: center;

      color: #6b7280;

      font-size: 12px;

      margin-top: 10px;

      line-height: 1.4;

    }


    .hidden {

      display: none !important;

    }


    /* ================================
       STATUS
       ================================ */

    .connection {

      text-align: center;

      font-size: 11px;

      color: #6b7280;

      margin-top: 9px;

    }


    /* ================================
       SMALL SCREEN
       ================================ */

    @media (
      max-height: 700px
    ) {

      .header-icon {

        font-size: 30px;

      }

      .header h1 {

        font-size: 20px;

      }

      #reader__scan_region {

        min-height: 220px;

      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- HEADER -->

  <div class="header">

    <div class="header-icon">
      🕌
    </div>

    <h1>
      PRESENSI SHOLAT
    </h1>

    <p>
      XII MIA 2 · 31 Siswa
    </p>

  </div>


  <!-- CARD -->

  <div class="card">


    <!-- SESSION -->

    <div class="session-label">
      Pilih Sesi
    </div>


    <div class="session-buttons">

      <button
        id="dzuhurBtn"
        class="session-button"
        onclick="selectSession('DZUHUR')">

        🕌 DZUHUR

      </button>


      <button
        id="asharBtn"
        class="session-button"
        onclick="selectSession('ASHAR')">

        🌇 ASHAR

      </button>

    </div>


    <!-- CAMERA BUTTON -->

    <button
      id="cameraButton"
      class="camera-button"
      onclick="toggleCamera()">

      📷 MULAI KAMERA

    </button>


    <!-- CAMERA -->

    <div
      id="reader"
      class="hidden">
    </div>


    <div
      id="scanGuide"
      class="scan-guide hidden">

      Arahkan QR ke tengah area kamera.
      Tidak perlu zoom.

    </div>


    <!-- COUNTER -->

    <div class="counter-box">

      <div class="counter-label">
        JUMLAH HADIR
      </div>

      <div
        id="counter"
        class="counter">

        0 / 31

      </div>

    </div>


    <!-- RESULT -->

    <div
      id="result"
      class="result">

      <div class="result-title">
        STATUS
      </div>

      <div>
        Pilih sesi kemudian
        mulai kamera.
      </div>

    </div>


    <div
      id="connection"
      class="connection">

      Server belum digunakan.

    </div>


    <div class="instruction">

      Setelah QR berhasil terbaca,
      kamera tetap aktif untuk
      siswa berikutnya.

    </div>


  </div>

</div>



<script>


/************************************************************
 * KONFIGURASI
 ************************************************************/

const API_URL =
  "https://script.google.com/macros/s/AKfycbykFmOUFR0f9nmBDHoi71nLPxru_bT-zVegH4U32mfKRZERoPN2toA0G3nU1q39aWowHg/exec";


const TOTAL_SISWA =
  31;


/************************************************************
 * STATE
 ************************************************************/

let selectedSession =
  "";

let scanner =
  null;

let cameraRunning =
  false;

let processingScan =
  false;


/*
 * Daftar QR yang sudah berhasil
 * pada sesi aktif.
 */

let attendanceSet =
  new Set();


/*
 * Menyimpan waktu terakhir QR tertentu
 * terlihat kamera.
 *
 * Berguna agar QR yang sama tidak
 * diproses berkali-kali.
 */

let lastScannedCode =
  "";

let lastScannedTime =
  0;


/*
 * Minimal jeda untuk QR yang sama.
 */

const SAME_QR_COOLDOWN =
  1800;


/*
 * Audio
 */

let audioContext =
  null;


/************************************************************
 * PILIH SESI
 ************************************************************/

function selectSession(
  session
) {

  /*
   * Jika kamera sedang aktif,
   * hentikan dahulu.
   */

  if (
    cameraRunning
  ) {

    stopCamera();

  }


  selectedSession =
    session;


  /*
   * Reset daftar hadir
   * untuk sesi baru.
   */

  attendanceSet =
    new Set();


  lastScannedCode =
    "";

  lastScannedTime =
    0;


  /*
   * Tampilan tombol.
   */

  document
    .getElementById(
      "dzuhurBtn"
    )
    .classList
    .toggle(
      "active",
      session === "DZUHUR"
    );


  document
    .getElementById(
      "asharBtn"
    )
    .classList
    .toggle(
      "active",
      session === "ASHAR"
    );


  updateCounter();


  showResult(
    "success",
    session === "DZUHUR"
      ? "🕌 SESI DZUHUR DIPILIH"
      : "🌇 SESI ASHAR DIPILIH",
    "Silakan tekan MULAI KAMERA."
  );


  document
    .getElementById(
      "connection"
    )
    .innerText =
      "Sesi " +
      session +
      " siap.";

}


/************************************************************
 * TOGGLE CAMERA
 ************************************************************/

async function toggleCamera() {

  if (
    cameraRunning
  ) {

    await stopCamera();

    return;

  }


  if (
    !selectedSession
  ) {

    showResult(
      "warning",
      "⚠️ PILIH SESI",
      "Pilih Dzuhur atau Ashar terlebih dahulu."
    );

    return;

  }


  await startCamera();

}


/************************************************************
 * START CAMERA
 ************************************************************/

async function startCamera() {

  const reader =
    document.getElementById(
      "reader"
    );


  reader.classList.remove(
    "hidden"
  );


  document
    .getElementById(
      "scanGuide"
    )
    .classList
    .remove(
      "hidden"
    );


  const button =
    document.getElementById(
      "cameraButton"
    );


  button.innerText =
    "⛔ HENTIKAN KAMERA";


  button.classList.add(
    "stop"
  );


  cameraRunning =
    true;


  processingScan =
    false;


  /*
   * Buat scanner baru.
   */

  scanner =
    new Html5Qrcode(
      "reader"
    );


  try {

    /*
     * Kamera belakang.
     */

    await scanner.start(

      {
        facingMode:
          {
            exact:
              "environment"
          }
      },

      {

        /*
         * FPS tinggi untuk
         * respons lebih cepat.
         */

        fps:
          30,


        /*
         * Area QR lebih fokus.
         */

        qrbox:
          function(
            width,
            height
          ) {

            const shortest =
              Math.min(
                width,
                height
              );


            /*
             * 58% dari sisi terpendek.
             *
             * QR diletakkan
             * di area ini.
             */

            const size =
              Math.floor(
                shortest * 0.58
              );


            return {

              width:
                size,

              height:
                size

            };

          },


        aspectRatio:
          1.0,


        disableFlip:
          true

      },


      onScanSuccess,


      onScanFailure

    );


    showResult(
      "",
      "📷 KAMERA AKTIF",
      "Arahkan QR ke area scan."
    );


    document
      .getElementById(
        "connection"
      )
      .innerText =
        "Kamera aktif · " +
        selectedSession;


  } catch (
    error
  ) {

    console.error(
      error
    );


    cameraRunning =
      false;


    scanner =
      null;


    button.innerText =
      "📷 MULAI KAMERA";


    button.classList.remove(
      "stop"
    );


    reader.classList.add(
      "hidden"
    );


    document
      .getElementById(
        "scanGuide"
      )
      .classList
      .add(
        "hidden"
      );


    /*
     * Fallback:
     * beberapa HP tidak menerima
     * facingMode exact.
     */

    try {

      await startCameraFallback();

    } catch (
      fallbackError
    ) {

      console.error(
        fallbackError
      );


      showResult(
        "error",
        "❌ KAMERA TIDAK DAPAT DIGUNAKAN",
        "Pastikan izin kamera diberikan pada browser."
      );

    }

  }

}


/************************************************************
 * FALLBACK CAMERA
 ************************************************************/

async function startCameraFallback() {

  const reader =
    document.getElementById(
      "reader"
    );


  reader.classList.remove(
    "hidden"
  );


  document
    .getElementById(
      "scanGuide"
    )
    .classList
    .remove(
      "hidden"
    );


  const button =
    document.getElementById(
      "cameraButton"
    );


  button.innerText =
    "⛔ HENTIKAN KAMERA";


  button.classList.add(
    "stop"
  );


  cameraRunning =
    true;


  scanner =
    new Html5Qrcode(
      "reader"
    );


  await scanner.start(

    {
      facingMode:
        "environment"
    },

    {

      fps:
        30,


      qrbox:
        function(
          width,
          height
        ) {

          const shortest =
            Math.min(
              width,
              height
            );


          const size =
            Math.floor(
              shortest * 0.58
            );


          return {

            width:
              size,

            height:
              size

          };

        },


      aspectRatio:
        1.0,


      disableFlip:
        true

    },


    onScanSuccess,


    onScanFailure

  );


  showResult(
    "",
    "📷 KAMERA AKTIF",
    "Arahkan QR ke area scan."
  );

}


/************************************************************
 * STOP CAMERA
 ************************************************************/

async function stopCamera() {

  cameraRunning =
    false;


  processingScan =
    false;


  if (
    scanner
  ) {

    try {

      await scanner.stop();

    } catch (
      error
    ) {

      console.warn(
        error
      );

    }


    try {

      scanner.clear();

    } catch (
      error
    ) {

      console.warn(
        error
      );

    }

  }


  scanner =
    null;


  document
    .getElementById(
      "reader"
    )
    .classList
    .add(
      "hidden"
    );


  document
    .getElementById(
      "scanGuide"
    )
    .classList
    .add(
      "hidden"
    );


  const button =
    document.getElementById(
      "cameraButton"
    );


  button.innerText =
    "📷 MULAI KAMERA";


  button.classList.remove(
    "stop"
  );


  document
    .getElementById(
      "connection"
    )
    .innerText =
      "Kamera berhenti.";

}


/************************************************************
 * QR BERHASIL TERBACA
 ************************************************************/

async function onScanSuccess(
  decodedText
) {

  if (
    !cameraRunning
  ) {

    return;

  }


  if (
    processingScan
  ) {

    return;

  }


  if (
    !selectedSession
  ) {

    return;

  }


  const kode =
    String(
      decodedText
    )
    .trim()
    .toUpperCase();


  if (
    !kode
  ) {

    return;

  }


  const now =
    Date.now();


  /*
   * Jika QR sama masih berada
   * di depan kamera, jangan proses
   * berulang kali.
   */

  if (

    kode ===
      lastScannedCode &&

    now -
      lastScannedTime <
      SAME_QR_COOLDOWN

  ) {

    return;

  }


  lastScannedCode =
    kode;


  lastScannedTime =
    now;


  /*
   * Jika sudah berhasil sebelumnya,
   * tidak perlu kirim ke server lagi.
   */

  if (
    attendanceSet.has(
      kode
    )
  ) {

    showResult(
      "warning",
      "🔒 SUDAH PRESENSI",
      kode
    );

    return;

  }


  /*
   * Kunci sementara agar
   * frame berikutnya tidak
   * memanggil server lagi.
   */

  processingScan =
    true;


  try {

    showResult(
      "",
      "⏳ MEMPROSES...",
      kode
    );


    /*
     * Kirim ke Apps Script.
     */

    const url =
      API_URL +
      "?action=scan" +
      "&kodeQR=" +
      encodeURIComponent(
        kode
      ) +
      "&sesi=" +
      encodeURIComponent(
        selectedSession
      );


    const response =
      await fetch(
        url,
        {
          method:
            "GET",

          cache:
            "no-store"
        }
      );


    const data =
      await response.json();


    /******************************************************
     * BERHASIL
     ******************************************************/

    if (
      data.status ===
      "SUCCESS"
    ) {

      /*
       * Simpan di memory browser.
       */

      attendanceSet.add(
        data.kode
      );


      updateCounter();


      /*
       * BEEP SATU KALI.
       */

      beep();


      /*
       * Tampilkan hasil.
       *
       * TIDAK ADA timer yang
       * menghapus hasil ini.
       */

      showSuccess(
        data
      );


      /*
       * Koneksi status.
       */

      document
        .getElementById(
          "connection"
        )
        .innerText =
          "✓ Tersimpan · " +
          data.jam;


    }


    /******************************************************
     * DUPLIKAT
     ******************************************************/

    else if (
      data.status ===
      "DUPLICATE"
    ) {

      /*
       * Masukkan ke memory.
       */

      attendanceSet.add(
        data.kode
      );


      updateCounter();


      showDuplicate(
        data
      );


      document
        .getElementById(
          "connection"
        )
        .innerText =
          "Siswa sudah tercatat.";

    }


    /******************************************************
     * QR TIDAK DIKENAL
     ******************************************************/

    else if (
      data.status ===
      "UNKNOWN_QR"
    ) {

      showResult(
        "error",
        "❌ QR TIDAK TERDAFTAR",
        kode
      );

    }


    /******************************************************
     * ERROR LAIN
     ******************************************************/

    else {

      showResult(
        "error",
        "❌ PRESENSI GAGAL",
        data.message ||
        "Terjadi kesalahan."
      );

    }


  } catch (
    error
  ) {

    console.error(
      error
    );


    showResult(
      "error",
      "❌ KONEKSI GAGAL",
      "Periksa koneksi internet."
    );


  } finally {

    /*
     * Jeda sangat singkat.
     *
     * Kamera tetap aktif.
     */

    setTimeout(
      () => {

        processingScan =
          false;

      },
      180
    );

  }

}


/************************************************************
 * SCAN FAILURE
 ************************************************************/

function onScanFailure(
  error
) {

  /*
   * Jangan menampilkan error.
   *
   * Scanner memang akan terus
   * mencoba membaca frame.
   */

}


/************************************************************
 * HASIL BERHASIL
 ************************************************************/

function showSuccess(
  data
) {

  const result =
    document.getElementById(
      "result"
    );


  result.className =
    "result success";


  result.innerHTML = `

    <div class="result-title">
      ✅ PRESENSI BERHASIL
    </div>

    <div class="result-name">
      ${escapeHtml(data.nama)}
    </div>

    <div class="result-code">
      ${escapeHtml(data.kode)}
    </div>

    <div class="result-session">
      ${
        data.sesi === "DZUHUR"
          ? "🕌 DZUHUR"
          : "🌇 ASHAR"
      }
    </div>

    <div class="result-time">
      ${escapeHtml(data.jam)}
    </div>

  `;

}


/************************************************************
 * DUPLIKAT
 ************************************************************/

function showDuplicate(
  data
) {

  const result =
    document.getElementById(
      "result"
    );


  result.className =
    "result warning";


  result.innerHTML = `

    <div class="result-title">
      🔒 SUDAH PRESENSI
    </div>

    <div class="result-name">
      ${escapeHtml(data.nama)}
    </div>

    <div class="result-code">
      ${escapeHtml(data.kode)}
    </div>

    <div class="result-session">
      ${
        data.sesi === "DZUHUR"
          ? "🕌 DZUHUR"
          : "🌇 ASHAR"
      }
    </div>

  `;

}


/************************************************************
 * HASIL UMUM
 ************************************************************/

function showResult(
  type,
  title,
  message
) {

  const result =
    document.getElementById(
      "result"
    );


  result.className =
    "result";


  if (
    type
  ) {

    result.classList.add(
      type
    );

  }


  result.innerHTML = `

    <div class="result-title">
      ${escapeHtml(title)}
    </div>

    <div>
      ${escapeHtml(message)}
    </div>

  `;

}


/************************************************************
 * COUNTER
 ************************************************************/

function updateCounter() {

  document
    .getElementById(
      "counter"
    )
    .innerText =
      attendanceSet.size +
      " / " +
      TOTAL_SISWA;

}


/************************************************************
 * BEEP
 *
 * SATU beep pendek.
 ************************************************************/

function beep() {

  try {

    if (
      !audioContext
    ) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


    const oscillator =
      audioContext
        .createOscillator();


    const gain =
      audioContext
        .createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.value =
      880;


    const start =
      audioContext.currentTime;


    gain.gain.setValueAtTime(
      0.0001,
      start
    );


    gain.gain.exponentialRampToValueAtTime(
      0.22,
      start + 0.01
    );


    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      start + 0.13
    );


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    oscillator.start(
      start
    );


    oscillator.stop(
      start + 0.13
    );


  } catch (
    error
  ) {

    console.warn(
      "Beep gagal:",
      error
    );

  }

}


/************************************************************
 * ESCAPE HTML
 ************************************************************/

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}

document.addEventListener(
  "DOMContentLoaded",
  () => {

    updateCounter();

  }
);
